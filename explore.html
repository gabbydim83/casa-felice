function usefulFacts(){const facts=[];if(item.location?.address)facts.push([t('address'),item.location.address]);if(item.rating)facts.push([t('rating'),`★ ${item.rating}`]);if(item.reviewCount!=null)facts.push([t('reviews'),Number(item.reviewCount).toLocaleString()]);if(item.distanceFromBrasov?.approxKm)facts.push([t('distance'),`≈ ${item.distanceFromBrasov.approxKm} km · ${item.distanceFromBrasov.approxDrivingMinutes||'—'} min`]);facts.push([t('category'),categoryName()]);if(item.priceLevel)facts.push(['Price level',item.priceLevel]);return facts}
function actionButtons(){const a=[];if(item.google?.mapsUrl)a.push(`<a class="btn btn-green" target="_blank" rel="noopener" href="${esc(item.google.mapsUrl)}">${t('map')} →</a>`);else if(item.location?.latitude)a.push(`<a class="btn btn-green" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${item.location.latitude}%2C${item.location.longitude}">${t('map')} →</a>`);const url=item.primaryAction?.url||item.website;if(url)a.push(`<a class="btn btn-outline" target="_blank" rel="noopener" href="${esc(url)}">${loc(item.primaryAction?.buttonLabel)||t('website')} →</a>`);return a.join('')}
function hasTransport(){return item.transportRequestEnabled===true||item.transportRequest?.enabled===true||['airport_transfer','custom_transport'].includes(item.category)}
function render(){document.documentElement.lang=lang;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('backText').textContent=t('back');document.getElementById('footerBooking').textContent=t('booking');document.getElementById('backLink').href=`index.html#${sectionBack()}`;const short=loc(item.shortDescription);const desc=loc(item.description)||short;galleryImages=(item.images?.length?item.images:['cover.webp']).map(imageUrl);if(!galleryImages.includes(imageUrl('cover.webp')))galleryImages.unshift(imageUrl('cover.webp'));galleryImages=[...new Set(galleryImages)];const facts=usefulFacts();const tags=(item.tags||[]).slice(0,12);const highlights=trueHighlights();document.title=`${loc(item.name)} | Explore Brașov`;document.getElementById('app').innerHTML=`
<header class="hero" style="background-image:url('${imageUrl(item.images?.[0]||'cover.webp')}')"><div class="container hero-inner"><div class="eyebrow">EXPLORE BRAȘOV · ${esc(categoryName())}</div><h1>${esc(loc(item.name))}</h1>${short?`<p>${esc(short)}</p>`:''}<div class="hero-meta">${item.rating?`<span class="pill">★ ${item.rating}</span>`:''}${item.location?.address?`<span class="pill">⌖ ${esc(item.location.address.split(',')[0])}</span>`:''}${item.distanceFromBrasov?.approxKm?`<span class="pill">≈ ${item.distanceFromBrasov.approxKm} km</span>`:''}</div></div></header>
<section class="main"><div class="container layout"><article class="content-card"><div class="kicker">${t('about')}</div><h2 class="section-title">${esc(loc(item.name))}</h2><p class="description">${esc(desc)}</p><div class="quick-facts">${facts.slice(0,4).map(([a,b])=>`<div class="fact"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div><div class="actions">${actionButtons()}</div></article><aside class="side-card"><h3>${t('practical')}</h3><div class="side-list">${facts.map(([a,b])=>`<div class="side-row"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div></aside></div></section>
${galleryImages.length?`<section class="gallery"><div class="container"><div class="gallery-head"><div><div class="kicker">${t('gallery')}</div><h2 class="section-title">${esc(loc(item.name))}</h2></div></div><div class="gallery-grid">${galleryImages.slice(0,5).map((src,i)=>`<div class="gallery-item" data-index="${i}"><img loading="lazy" src="${src}" alt="${esc(loc(item.name))}"></div>`).join('')}</div></div></section>`:''}
<section class="info-section"><div class="container info-grid"><article class="info-card"><h3>${t('hours')}</h3>${hoursHtml()}</article><article class="info-card"><h3>${t('pricing')}</h3>${pricesHtml()}</article><article class="info-card"><h3>${t('highlights')}</h3><div class="chips">${[...highlights,...tags.map(labelize)].slice(0,18).map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="chip">Explore Brașov</span>'}</div></article><article class="info-card"><h3>${t('practical')}</h3><div class="side-list">${facts.map(([a,b])=>`<div class="side-row"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div><div class="actions">${actionButtons()}</div></article></div></section>
${hasTransport()?transportHtml():''}`;bindGallery();bindTransport()}
function transportHtml(){return`<section class="transport"><div class="container transport-box"><div><div class="eyebrow">EXPLORE BRAȘOV TRANSPORT</div><h2>${t('transportTitle')}</h2><p>${t('transportText')}</p></div><div class="transport-form"><div class="form-grid"><div class="field full"><label>${t('name')}</label><input id="trName"></div><div class="field"><label>${t('date')}</label><input id="trDate" type="date"></div><div class="field"><label>${t('time')}</label><input id="trTime" type="time"></div><div class="field"><label>${t('guests')}</label><input id="trGuests" type="number" min="1" value="2"></div><div class="field"><label>${t('pickup')}</label><input id="trPickup" value="Casa Felice"></div><div class="field full"><label>${t('notes')}</label><textarea id="trNotes"></textarea></div></div><button class="btn btn-green" style="margin-top:16px" id="sendTransport">${t('send')}</button><p class="form-note" id="providerNote"></p></div></div></section>`}
function bindGallery(){document.querySelectorAll('.gallery-item').forEach(el=>el.onclick=()=>openLb(Number(el.dataset.index)))}function openLb(i){galleryIndex=(i+galleryImages.length)%galleryImages.length;document.getElementById('lbImg').src=galleryImages[galleryIndex];document.getElementById('lbCounter').textContent=`${galleryIndex+1} / ${galleryImages.length}`;document.getElementById('lightbox').classList.add('open');document.body.classList.add('no-scroll')}function closeLb(){document.getElementById('lightbox').classList.remove('open');document.body.classList.remove('no-scroll')}document.getElementById('lbClose').onclick=closeLb;document.getElementById('lbPrev').onclick=()=>openLb(galleryIndex-1);document.getElementById('lbNext').onclick=()=>openLb(galleryIndex+1);document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLb()};document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')openLb(galleryIndex-1);if(e.key==='ArrowRight')openLb(galleryIndex+1)});
function bindTransport(){const b=document.getElementById('sendTransport');if(!b)return;const note=document.getElementById('providerNote');if(providers[0])note.textContent=`${lang==='ro'?'Furnizor principal':lang==='de'?'Hauptanbieter':'Primary provider'}: ${providers[0].name}`;b.onclick=()=>{const provider=providers[0];const number=(provider?.whatsapp||provider?.phone||'').replace(/\D/g,'');if(!number){alert('Transport provider unavailable.');return}const fields={name:document.getElementById('trName').value||'-',date:document.getElementById('trDate').value||'-',time:document.getElementById('trTime').value||'-',guests:document.getElementById('trGuests').value||'-',pickup:document.getElementById('trPickup').value||'Casa Felice',notes:document.getElementById('trNotes').value||'-'};let msg=loc(item.transportRequest?.messageTemplate);if(msg){msg=msg.replaceAll('{date}',fields.date).replaceAll('{time}',fields.time).replaceAll('{passengers}',fields.guests).replaceAll('{pickup}',fields.pickup).replaceAll('{notes}',fields.notes)}else{msg=`${loc(item.name)}\n${t('name')}: ${fields.name}\n${t('date')}: ${fields.date}\n${t('time')}: ${fields.time}\n${t('guests')}: ${fields.guests}\n${t('pickup')}: ${fields.pickup}\n${t('notes')}: ${fields.notes}`}window.open(`https://wa.me/${number}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}}
async function load(){if(!id){showError();return}try{const [raw,p]=await Promise.all([getJson(`${section}/${id}/index.json`),getJson('transport/providers.json').catch(()=>({providers:[]}))]);item=normalize(raw);providers=(p.providers||[]).filter(x=>x.active!==false).sort((a,b)=>(a.priority||99)-(b.priority||99));if(!item)throw new Error('Item not found');render()}catch(e){console.error(e);showError()}}
function showError(){document.getElementById('app').innerHTML=`<div class="error"><div><h1>${t('errorTitle')}</h1><p>${t('errorText')}</p><a class="btn btn-green" style="margin-top:20px" href="index.html#explore">${t('back')}</a></div></div>`}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u);if(item)render();else showError()});window.addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('scrolled',scrollY>30));load();
</script>
</body>
</html>
